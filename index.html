<title>福祉用具サービス計画書 入力アプリ</title>
<style>
  :root{
    --bg:#f6f5f1;
    --panel:#ffffff;
    --ink:#1f2a24;
    --ink-soft:#5b675f;
    --line:#d8dcd6;
    --accent:#2f6f5e;
    --accent-ink:#ffffff;
    --accent-soft:#e4f0eb;
    --danger:#a3432f;
    --field-bg:#fbfbf9;
    --shadow: 0 1px 2px rgba(31,42,36,0.06);
    font-family: -apple-system, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic", "Noto Sans JP", sans-serif;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#14181a; --panel:#1d2224; --ink:#eef1ee; --ink-soft:#a7b2ac; --line:#333a3c;
      --accent:#5fae95; --accent-ink:#0d1512; --accent-soft:#213330; --danger:#e08a76;
      --field-bg:#20262a; --shadow: 0 1px 3px rgba(0,0,0,0.4);
    }
  }
  :root[data-theme="dark"]{
    --bg:#14181a; --panel:#1d2224; --ink:#eef1ee; --ink-soft:#a7b2ac; --line:#333a3c;
    --accent:#5fae95; --accent-ink:#0d1512; --accent-soft:#213330; --danger:#e08a76;
    --field-bg:#20262a; --shadow: 0 1px 3px rgba(0,0,0,0.4);
  }
  *{box-sizing:border-box;}
  body{ margin:0; background:var(--bg); color:var(--ink); padding-bottom:84px; -webkit-tap-highlight-color: transparent; }
  header.app-head{ position:sticky; top:0; z-index:30; background:var(--panel); border-bottom:1px solid var(--line); }
  .head-inner{ max-width:760px; margin:0 auto; padding:14px 16px 0 16px; }
  h1{ font-size:17px; margin:0 0 10px 0; font-weight:700; letter-spacing:.02em; }
  h1 small{ display:block; font-weight:500; font-size:12px; color:var(--ink-soft); margin-top:2px; }
  .back-row{ display:flex; align-items:center; gap:8px; margin-bottom:8px; }
  .back-row button{ appearance:none; border:1px solid var(--line); background:var(--field-bg); color:var(--ink); font-size:12.5px; font-weight:700; padding:6px 10px; border-radius:7px; cursor:pointer; }
  .back-row .client-label{ font-size:13px; font-weight:700; color:var(--ink); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  nav.tabs{ display:flex; gap:2px; overflow-x:auto; scrollbar-width:none; }
  nav.tabs::-webkit-scrollbar{display:none;}
  nav.tabs button{ appearance:none; border:none; background:transparent; color:var(--ink-soft); padding:10px 14px; font-size:13.5px; font-weight:600; white-space:nowrap; border-bottom:3px solid transparent; cursor:pointer; }
  nav.tabs button.active{ color:var(--accent); border-bottom-color:var(--accent); }

  main{ max-width:760px; margin:0 auto; padding:16px; }
  section.sheet{ display:none; }
  section.sheet.active{ display:block; }

  .card{ background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:14px 14px 16px 14px; margin-bottom:14px; box-shadow:var(--shadow); }
  .card > .card-title{ font-size:13px; font-weight:700; color:var(--accent); margin:0 0 10px 0; padding-bottom:8px; border-bottom:1px solid var(--line); }
  .row{ display:flex; flex-wrap:wrap; gap:10px; margin-bottom:10px; }
  .row:last-child{ margin-bottom:0; }
  .field{ flex:1 1 150px; min-width:0; }
  .field.wide{ flex-basis:100%; }
  .field.narrow{ flex:0 1 90px; }
  label.f-label{ display:block; font-size:11.5px; color:var(--ink-soft); margin-bottom:4px; font-weight:600; }
  .hint{ font-size:11.5px; color:var(--ink-soft); }
  input[type=text], input[type=date], input[type=number], input[type=search], textarea, select{
    width:100%; font-size:15px; padding:9px 10px; border:1px solid var(--line);
    border-radius:7px; background:var(--field-bg); color:var(--ink); font-family:inherit;
  }
  textarea{ resize:vertical; min-height:52px; line-height:1.5; }
  input:focus, textarea:focus, select:focus{ outline:2px solid var(--accent); outline-offset:1px; border-color:var(--accent); }

  .seg{ display:flex; flex-wrap:wrap; gap:6px; }
  .seg label{ flex:1 1 auto; text-align:center; font-size:12.5px; padding:8px 8px; border:1px solid var(--line); border-radius:7px; background:var(--field-bg); color:var(--ink-soft); cursor:pointer; user-select:none; }
  .seg input{ position:absolute; opacity:0; width:0; height:0; }
  .seg label:has(input:checked){ background:var(--accent); border-color:var(--accent); color:var(--accent-ink); font-weight:700; }

  .sync-badge{ font-size:11px; opacity:.55; margin-left:3px; }

  .repeat-item{ border:1px solid var(--line); border-radius:8px; padding:10px; margin-bottom:10px; background:var(--field-bg); }
  .repeat-item .item-head{ display:flex; justify-content:space-between; align-items:center; margin-bottom:8px; }
  .item-head span{ font-size:12px; font-weight:700; color:var(--accent); }
  .btn-mini{ appearance:none; border:1px solid var(--line); background:var(--panel); color:var(--ink-soft); font-size:11.5px; padding:4px 9px; border-radius:6px; cursor:pointer; }
  .btn-add{ width:100%; padding:10px; border:1px dashed var(--line); border-radius:8px; background:transparent; color:var(--accent); font-size:13px; font-weight:700; cursor:pointer; }

  .agree-item{ display:flex; gap:8px; align-items:flex-start; margin-bottom:8px; font-size:13px; line-height:1.5; }
  .agree-item input{ margin-top:3px; flex:0 0 auto; width:16px; height:16px; }

  .danger-link{ appearance:none; border:none; background:transparent; color:var(--danger); font-size:12px; padding:6px 0 0 0; cursor:pointer; text-decoration:underline; }

  .sig-wrap{ border:1px solid var(--line); border-radius:8px; background:#fff; touch-action:none; overflow:hidden; }
  .sig-wrap canvas{ width:100%; height:180px; display:block; }
  .sig-actions{ display:flex; gap:8px; margin-top:8px; }
  .sig-actions .btn-mini{ flex:0 0 auto; padding:8px 12px; }
  #sigPreviewWrap img{ max-width:280px; width:100%; border:1px solid var(--line); border-radius:6px; margin-top:8px; background:#fff; }

  footer.actionbar{ position:fixed; bottom:0; left:0; right:0; z-index:30; background:var(--panel); border-top:1px solid var(--line); padding:10px 16px calc(10px + env(safe-area-inset-bottom)); }
  .actionbar-inner{ max-width:760px; margin:0 auto; display:flex; gap:8px; }
  .btn{ flex:1; padding:12px; border-radius:8px; font-size:14px; font-weight:700; border:1px solid var(--line); background:var(--field-bg); color:var(--ink); cursor:pointer; }
  .btn.primary{ background:var(--accent); border-color:var(--accent); color:var(--accent-ink); }
  .btn.ghost{ background:transparent; }
  .save-note{ text-align:center; font-size:11px; color:var(--ink-soft); margin-top:6px; min-height:14px; }

  /* ---- client list screen ---- */
  .list-toolbar{ display:flex; gap:8px; margin-bottom:14px; }
  .list-toolbar input{ flex:1; }
  .list-toolbar button{ flex:0 0 auto; padding:10px 14px; }
  .due-banner{ background:#faf0cf; color:#6b5416; border:1px solid #e9d8a6; border-radius:8px; padding:10px 12px; font-size:12.5px; margin-bottom:12px; font-weight:700; }
  .due-banner.danger{ background:#f6d9d2; color:#7a2c1e; border-color:#e3b3a4; }
  .list-sort{ display:flex; gap:6px; margin-bottom:12px; }
  .list-sort button{ flex:1; padding:8px; border:1px solid var(--line); background:var(--field-bg); border-radius:7px; font-size:12px; font-weight:700; color:var(--ink-soft); cursor:pointer; }
  .list-sort button.active{ background:var(--accent); border-color:var(--accent); color:var(--accent-ink); }
  .due-badge{ display:inline-block; font-size:11px; font-weight:700; padding:3px 9px; border-radius:12px; margin-top:6px; }
  .due-over{ background:#f6d9d2; color:#8a3223; }
  .due-soon{ background:#faf0cf; color:#8a6d1a; }
  .due-ok{ background:var(--accent-soft); color:var(--accent); }
  .due-unknown{ background:var(--field-bg); color:var(--ink-soft); border:1px solid var(--line); }
  .client-list{ display:flex; flex-direction:column; gap:8px; }
  .client-item{
    display:block; width:100%; text-align:left; appearance:none; border:1px solid var(--line);
    background:var(--panel); border-radius:10px; padding:12px 14px; cursor:pointer; box-shadow:var(--shadow);
  }
  .client-item:active{ background:var(--accent-soft); }
  .ci-main{ display:flex; justify-content:space-between; align-items:baseline; gap:8px; }
  .ci-name{ font-size:15px; font-weight:700; color:var(--ink); }
  .ci-care{ font-size:12px; color:var(--ink-soft); flex:0 0 auto; }
  .ci-meta{ font-size:11.5px; color:var(--ink-soft); margin-top:4px; }
  .empty-note{ text-align:center; color:var(--ink-soft); font-size:13px; padding:30px 10px; }
  .status-banner{ font-size:12px; color:var(--ink-soft); text-align:center; padding:6px 0; }

  /* ---------- print ---------- */
  @media print{
    :root{ --bg:#fff; --panel:#fff; --ink:#000; --ink-soft:#333; --line:#999; --field-bg:#fff; --accent:#000; --accent-ink:#fff; --shadow:none;}
    body{ padding-bottom:0; }
    header.app-head, footer.actionbar, .no-print{ display:none !important; }
    main{ max-width:100%; padding:0; }
    section.sheet{ display:block !important; page-break-after:always; }
    section.sheet:last-child{ page-break-after:auto; }
    .card{ box-shadow:none; border:1px solid #999; break-inside:avoid; margin-bottom:10px; }
    .print-title{ display:block !important; font-size:16px; font-weight:700; margin-bottom:10px; }
    input, textarea, select{ border:none; border-bottom:1px solid #999; border-radius:0; padding:3px 2px; background:transparent; }
    .seg label{ border:1px solid #999; }
    .seg label:has(input:checked){ background:#ddd; color:#000; border-color:#333; }
    .btn-mini, .btn-add, .sync-badge{ display:none !important; }
  }
  .print-title{ display:none; }
</style>
</head>

<div id="hamatokuStatusBar" style="position:sticky;top:0;z-index:9999;background:#17324d;color:#fff;padding:7px 12px;font-size:13px;display:flex;gap:12px;align-items:center;justify-content:space-between">
  <span>浜徳商事｜福祉用具計画書</span>
  <span id="hamatokuConn" style="color: rgb(255, 210, 122);">● Firebase接続確認中…</span>
</div>
<script>
(function(){
  function setStatus(){
    var el=document.getElementById('hamatokuConn');
    if(!el)return;
    el.textContent='● Firebase接続確認中…';
    el.style.color='#ffd27a';
  }
  setStatus();
  setTimeout(setStatus,1200);
})();
</script>

  function collectForm(){

      if(!el.name) return;
      if(el.type === "radio"){ if(el.checked) data[el.name] = el.value; }

      else { data[el.name] = el.value; }

  function applyForm(data){
    if(!data) return;
    var active = document.activeElement;
    var activeName = (active && active.name) ? active.name : null;
    main.querySelectorAll("#editScreen input, #editScreen textarea, #editScreen select").forEach(function(el){
      if(!el.name || !(el.name in data)) return;
      if(el.name === activeName) return; // don't clobber what's being typed right now
      if(el.type === "radio"){ el.checked = (el.value === data[el.name]); }
      else if(el.type === "checkbox"){ el.checked = !!data[el.name]; }
      else { el.value = data[el.name]; }
    });
  }

  function fmtTime(iso){
    if(!iso) return "";
    try{
      var d = new Date(iso);
      return d.toLocaleString("ja-JP",{month:"numeric", day:"numeric", hour:"2-digit", minute:"2-digit"});
    }catch(e){ return ""; }
  }

  // ---------- monitoring due-date helpers (default: every 6 months) ----------
  function parseDateOnly(v){
    if(!v) return null;
    var d = new Date(v.length <= 10 ? (v + "T00:00:00") : v);
    return isNaN(d.getTime()) ? null : d;
  }
  function addMonths(date, n){
    var d = new Date(date.getTime());
    var originalDay = d.getDate();
    d.setDate(1);
    d.setMonth(d.getMonth() + n);
    var lastDay = new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate();
    d.setDate(Math.min(originalDay, lastDay));
    return d;
  }
  function toDateInputValue(d){
    var y = d.getFullYear(), m = ("0"+(d.getMonth()+1)).slice(-2), day = ("0"+d.getDate()).slice(-2);
    return y + "-" + m + "-" + day;
  }
  function fmtDateOnly(d){
    return d.toLocaleDateString("ja-JP", {year:"numeric", month:"numeric", day:"numeric"});
  }
  function calcAge(birthStr){
    var b = parseDateOnly(birthStr);
    if(!b) return "";
    var now = new Date();
    var age = now.getFullYear() - b.getFullYear();
    var m = now.getMonth() - b.getMonth();
    if(m < 0 || (m === 0 && now.getDate() < b.getDate())) age--;
    return (age >= 0 && age < 130) ? String(age) : "";
  }
  function hiraganaToKatakana(str){
    return String(str||"").replace(/[\u3041-\u3096]/g, function(ch){
      return String.fromCharCode(ch.charCodeAt(0) + 0x60);
    });
  }
  // Next monitoring due date: manual entry wins; otherwise auto-estimate at
  // +6 months from the last monitoring visit, or from plan start if none yet.
  function computeNextDue(data){
    if(data.m_nextMonitor){ var d0 = parseDateOnly(data.m_nextMonitor); if(d0) return { date: d0, auto:false }; }
    if(data.m_date){ var d1 = parseDateOnly(data.m_date); if(d1) return { date: addMonths(d1,6), auto:true }; }
    var start = data.p_agreeDate || data.b_date;
    if(start){ var d2 = parseDateOnly(start); if(d2) return { date: addMonths(d2,6), auto:true }; }
    return { date: null, auto:false };
  }
  function dueStatus(dateObj){
    if(!dateObj) return { label:"予定日未設定", cls:"due-unknown", days:null };
    var now = new Date(); now.setHours(0,0,0,0);
    var d = new Date(dateObj.getTime()); d.setHours(0,0,0,0);
    var days = Math.round((d - now) / 86400000);
    if(days < 0) return { label:"期限超過（"+Math.abs(days)+"日経過）", cls:"due-over", days:days };
    if(days === 0) return { label:"本日が予定日", cls:"due-soon", days:days };
    if(days <= 30) return { label:"あと"+days+"日（"+fmtDateOnly(dateObj)+"）", cls:"due-soon", days:days };
    return { label:fmtDateOnly(dateObj)+" 予定", cls:"due-ok", days:days };
  }

  function updateDueBanner(){
    var banner = document.getElementById("dueBanner");
    if(!banner) return;
    var over = 0, soon = 0;
    S.listSnapshot.forEach(function(item){
      var st = dueStatus(computeNextDue(item.data).date);
      if(st.cls === "due-over") over++;
      else if(st.cls === "due-soon") soon++;
    });
    if(over === 0 && soon === 0){ banner.style.display = "none"; return; }
    banner.className = "due-banner no-print" + (over > 0 ? " danger" : "");
    var parts = [];
    if(over > 0) parts.push("期限超過 " + over + "件");
    if(soon > 0) parts.push("30日以内 " + soon + "件");
    banner.textContent = "⚠️ モニタリング予定：" + parts.join("・");
    banner.style.display = "block";
  }

  function renderClientItems(filterText){
    var wrap = document.getElementById("clientListEl");
    if(!wrap) return;
    var q = (filterText||"").trim();
    var rows = S.listSnapshot.filter(function(item){
      if(!q) return true;
      var hay = clientDisplayName(item.data) + " " + clientDisplayKana(item.data);
      return hay.indexOf(q) !== -1;
    });
    rows = rows.map(function(item){
      var due = computeNextDue(item.data);
      return { item:item, due:due, status:dueStatus(due.date) };
    });
    if(S.listSort === "due"){
      rows.sort(function(a,b){
        var ad = (a.status.days===null) ? Infinity : a.status.days;
        var bd = (b.status.days===null) ? Infinity : b.status.days;
        return ad - bd;
      });
    }
    if(rows.length === 0){
      wrap.innerHTML = '<div class="empty-note">'+(S.listSnapshot.length===0 ? "まだ利用者データがありません。「＋ 新しい利用者」から作成してください。" : "該当する利用者が見つかりません。")+'</div>';
      return;

      var d = row.item.data;

      var kana = esc2(clientDisplayKana(d));

  function openClient(id, fromPopState){
    if(!fromPopState){
      history.pushState({screen:"edit", id:id}, "", location.pathname + location.search);
    }
    if(S.unsubDoc){ S.unsubDoc(); S.unsubDoc = null; }
    S.clientId = id;

    backRow.style.display = "flex";
    actionbar.style.display = "block";
    saveNote.textContent = "読み込み中…";

    if(!S.db){ return; }
    S.unsubDoc = S.db.doc("clients/"+id).onSnapshot(function(snap){
      if(!snap.exists){
        saveNote.textContent = "この利用者データは見つかりませんでした（削除された可能性があります）";
        return;
      }
      var data = snap.data() || {};
      var freshBuild = (main.querySelector("#editScreen") === null);
      S.equipCount = data.equipCount || 3;
      S.usageCount = data.usageCount || 4;
      if(freshBuild){ buildEditScreen(); }
      applyForm(data);

      // 6か月後を「次回モニタリング予定日」に自動反映する。
      // 既に手入力された予定日は上書きしない。
      var autoBase = parseDateOnly(data.m_date);
      var currentNext = data.m_nextMonitor || data.p_nextMonitor || "";
      if(autoBase && !currentNext){
        var autoNext = toDateInputValue(addMonths(autoBase, 6));
        ["m_nextMonitor","p_nextMonitor"].forEach(function(n){
          var el = main.querySelector('[name="'+n+'"]');
          if(el) el.value = autoNext;
        });
        data.m_nextMonitor = autoNext;
        data.p_nextMonitor = autoNext;
        // 画面に表示するだけでなく共有DBにも保存する。
        queueSave();
      }

      if(freshBuild){ wireEditScreenEvents(); }
      clientLabel.textContent = clientDisplayName(data);
      if(!snap.metadata.hasPendingWrites){
        saveNote.textContent = data.updatedAt ? ("同期済み（最終更新 " + fmtTime(data.updatedAt) + "）") : "";
      }
    }, function(err){
      saveNote.textContent = "同期エラー（"+err.code+"）";
    });

  function initSignaturePad(){
    var canvas = document.getElementById("sigPad");
    var clearBtn = document.getElementById("btnSigClear");
    var confirmBtn = document.getElementById("btnSigConfirm");
    var statusEl = document.getElementById("sigStatus");
    var hidden = main.querySelector('#editScreen [name="m_signatureData"]');
    if(!canvas || !hidden) { return; }

    var ctx = canvas.getContext("2d");
    var hasDrawn = false;
    var drawing = false, lastX = 0, lastY = 0;

    function sizeCanvas(){
      var cssWidth = canvas.clientWidth || 300;
      var cssHeight = 180;
      var dpr = Math.min(window.devicePixelRatio || 1, 2);
      canvas.width = cssWidth * dpr;
      canvas.height = cssHeight * dpr;
      ctx.setTransform(dpr,0,0,dpr,0,0);
      ctx.lineWidth = 2.4;
      ctx.lineCap = "round";
      ctx.lineJoin = "round";
      ctx.strokeStyle = "#1f2a24";
      ctx.fillStyle = "#ffffff";
      ctx.fillRect(0,0,cssWidth,cssHeight);
    }
    sizeCanvas();

    function posFromEvent(e){
      var rect = canvas.getBoundingClientRect();
      return { x: e.clientX - rect.left, y: e.clientY - rect.top };
    }
    canvas.addEventListener("pointerdown", function(e){
      drawing = true; hasDrawn = true;
      var p = posFromEvent(e); lastX = p.x; lastY = p.y;
      try{ canvas.setPointerCapture(e.pointerId); }catch(err){}
      e.preventDefault();
    });
    canvas.addEventListener("pointermove", function(e){
      if(!drawing) return;
      var p = posFromEvent(e);
      ctx.beginPath(); ctx.moveTo(lastX,lastY); ctx.lineTo(p.x,p.y); ctx.stroke();
      lastX = p.x; lastY = p.y;
      e.preventDefault();
    });
    function stopDraw(){ drawing = false; }
    canvas.addEventListener("pointerup", stopDraw);
    canvas.addEventListener("pointercancel", stopDraw);
    canvas.addEventListener("pointerleave", stopDraw);

    if(clearBtn) clearBtn.onclick = function(){
      sizeCanvas();
      hasDrawn = false;
      if(statusEl) statusEl.textContent = "";
    };

    if(confirmBtn) confirmBtn.onclick = function(){
      if(!hasDrawn){
        if(statusEl) statusEl.textContent = "署名を描いてから確定してください。";
        return;
      }
      var dataUrl = canvas.toDataURL("image/png");
      hidden.value = dataUrl;
      hidden.dispatchEvent(new Event("input", {bubbles:true}));
      if(statusEl) statusEl.textContent = "署名を確定しました。";
      renderSigPreview(dataUrl);
    };

    renderSigPreview(hidden.value || "");
  }

  // shift field values down by one to fill the gap left by a removed row, using the in-memory form
  function removeAndRenumber(prefix, kind, removedIdx, count){
    var data = collectForm();
    var fieldsPerItem = kind === "equip"
      ? ["no","kind","units","model","type","code","reason"]
      : ["no","model","start","problem","check","policy","reason"];
    for(var i=removedIdx; i<count; i++){
      fieldsPerItem.forEach(function(f){
        var fromKey = prefix + f + (i+1);
        var toKey = prefix + f + i;
        if(fromKey in data) data[toKey] = data[fromKey];
      });
    }
    applyForm(data);
  }

  function deleteCurrentClient(){
    if(!S.clientId) return;
    if(!confirm("この利用者のデータを完全に削除します。元に戻せません。よろしいですか？")) return;
    var id = S.clientId;
    if(S.unsubDoc){ S.unsubDoc(); S.unsubDoc = null; }
    S.db.doc("clients/"+id).delete().then(function(){
      if(history.state && history.state.screen === "edit"){ history.back(); }
      else { backToList(true); }
    }).catch(function(){
      alert("削除に失敗しました。通信状態を確認してもう一度お試しください。");
    });
  }

  function backToList(fromPopState){
    if(S.unsubDoc){ S.unsubDoc(); S.unsubDoc = null; }
    S.clientId = null;
    renderListScreen();
  }

  // ---------- browser/gesture back navigation moves within the app instead of closing it ----------
  window.addEventListener("popstate", function(e){
    var st = e.state;
    if(st && st.screen === "edit" && st.id){
      openClient(st.id, true);
    } else {
      backToList(true);
    }
  });

  // ---------- tabs (delegated, works after rebuilds) ----------
  tabNav.addEventListener("click", function(e){
    var btn = e.target.closest("button[data-tab]");
    if(!btn) return;
    tabNav.querySelectorAll("button").forEach(function(b){ b.classList.remove("active"); });
    btn.classList.add("active");
    document.querySelectorAll("section.sheet").forEach(function(s){ s.classList.remove("active"); });
    var target = document.getElementById("sheet-"+btn.dataset.tab);
    if(target) target.classList.add("active");
    window.scrollTo({top:0, behavior:"instant"});
  });

  document.getElementById("btnBack").addEventListener("click", function(){
    if(history.state && history.state.screen === "edit"){ history.back(); }
    else { backToList(); }
  });

  // ---------- cross-field sync + reason templates + autosave (delegated) ----------
  function syncFromField(el){
    var group = SYNC_MAP[el.name];
    if(!group) return;
    var value = el.value;
    group.forEach(function(otherName){
      if(otherName === el.name) return;
      var other = main.querySelector('[name="'+otherName+'"]');
      if(other && other.value !== value) other.value = value;
    });
  }

  main.addEventListener("input", function(e){
    if(S.screen !== "edit") return;
    if(e.target && e.target.name) syncFromField(e.target);

    if(e.target.name === "b_birth" || e.target.name === "p_birth"){
      var age = calcAge(e.target.value);
      ["b_age","p_age"].forEach(function(n){
        var el = main.querySelector('[name="'+n+'"]');
        if(el) el.value = age;
      });
    }
    queueSave();
  });

  // remember the value a date field held just before the user changes it,
  // so we can carry it over to "前回実施日" automatically
  main.addEventListener("focusin", function(e){
    if(e.target && e.target.name === "m_date"){
      e.target.dataset.prevValue = e.target.value || "";
    }
  });

  main.addEventListener("change", function(e){
    if(S.screen !== "edit") return;
    if(e.target && e.target.name) syncFromField(e.target);

    if(e.target.classList && e.target.classList.contains("tmpl-select")){
      var text = e.target.value;
      if(text){
        var target = main.querySelector('[name="'+e.target.dataset.target+'"]');
        if(target){
          target.value = target.value && target.value.trim() ? (target.value.replace(/\s+$/,"") + "\n" + text) : text;
        }
        e.target.value = "";
      }
    }

    if(e.target.name === "m_date" && e.target.value){
      var oldVal = e.target.dataset.prevValue || "";
      var prevDateInput = main.querySelector('[name="m_prevDate"]');
      if(prevDateInput && !prevDateInput.value && oldVal && oldVal !== e.target.value){
        prevDateInput.value = oldVal;
        prevDateInput.dispatchEvent(new Event("input", {bubbles:true}));
      }
      e.target.dataset.prevValue = e.target.value;

      var nextInput = main.querySelector('[name="m_nextMonitor"]');
      if(nextInput && !nextInput.value){
        var dBase = parseDateOnly(e.target.value);
        if(dBase){
          nextInput.value = toDateInputValue(addMonths(dBase, 6));
          nextInput.dispatchEvent(new Event("input", {bubbles:true}));
        }
      }
    }
    queueSave();

  });

  // ---------- furigana auto-fill from Japanese IME reading ----------
  // IME/ブラウザによって compositionend の e.data が「田中」のような
  // 確定後の漢字になることがあるため、compositionupdate / beforeinput で
  // 変換前の読み（ひらがな・カタカナ）を保持して、確定時にフリガナへ反映する。
  var NAME_FIELDS = ["b_name","p_name","m_name"];
  var compBuffers = {};
  function isKanaReading(v){ return /^[ぁ-ゖァ-ヺー・]+$/.test(String(v||"")); }
  function applyAutoKana(nameField, reading){
    if(!reading || !isKanaReading(reading)) return;
    var kanaField = nameField.replace("_name", "_kana");
    var kanaInput = main.querySelector('[name="'+kanaField+'"]');
    if(!kanaInput) return;
    var kata = hiraganaToKatakana(reading);
    // 自動入力した値であることを記録。手入力で変更された場合は上書きしない。
    kanaInput.value = kata;
    kanaInput.dataset.autoKana = kata;
    kanaInput.dispatchEvent(new Event("input", {bubbles:true}));
  }
  main.addEventListener("compositionstart", function(e){
    if(!e.target.name || NAME_FIELDS.indexOf(e.target.name) === -1) return;
    compBuffers[e.target.name] = "";
  });
  main.addEventListener("compositionupdate", function(e){
    if(!e.target.name || NAME_FIELDS.indexOf(e.target.name) === -1) return;
    if(isKanaReading(e.data)) compBuffers[e.target.name] = e.data;
  });
  main.addEventListener("beforeinput", function(e){
    if(!e.target.name || NAME_FIELDS.indexOf(e.target.name) === -1) return;
    if(e.inputType === "insertCompositionText" && isKanaReading(e.data)) {
      compBuffers[e.target.name] = e.data;
    }
  });
  main.addEventListener("compositionend", function(e){
    if(!e.target.name || NAME_FIELDS.indexOf(e.target.name) === -1) return;
    var fieldName = e.target.name;
    var hira = compBuffers[fieldName] || "";
    delete compBuffers[fieldName];
    // compositionend の e.data が読みになるIMEもある。
    if(isKanaReading(e.data)) hira = e.data;
    applyAutoKana(fieldName, hira);
  });

  // ---------- save to shared db, with local fallback while offline ----------
  function cacheKey(id){ return "keikakusho_cache_" + id; }

  function queueSave(){
    if(S.screen !== "edit" || !S.clientId) return;
    clearTimeout(S.saveTimer);
    S.saveTimer = setTimeout(doSave, 500);
  }

  function doSave(){
    if(!S.clientId) return;
    var record = collectForm();
    record.updatedAt = new Date().toISOString();
    record.updatedBy = S.myId || null;
    try{ localStorage.setItem(cacheKey(S.clientId), JSON.stringify(record)); }catch(e){}
    S.pending = record;
    flush();
  }

  function flush(){
    if(!S.pending || !S.clientId || !S.db) return;
    var record = S.pending;
    var id = S.clientId;
    saveNote.textContent = "保存中…";
    S.db.doc("clients/"+id).set(record).then(function(){
      if(S.pending === record) S.pending = null;
      if(S.clientId === id) saveNote.textContent = "同期済み（" + fmtTime(record.updatedAt) + "）";
      clearInterval(S.retryTimer); S.retryTimer = null;
    }).catch(function(){
      saveNote.textContent = "オフライン：この端末に保存中（通信が戻り次第、自動で送信します）";
      if(!S.retryTimer){ S.retryTimer = setInterval(flush, 15000); }
    });
  }

  window.addEventListener("online", flush);

  // ---------- print ----------
  document.getElementById("btnPrint").addEventListener("click", function(){
    doSave();
    window.print();
  });

  // ================= boot =================

  // ===== Firebase接続・ログイン =====
  function renderLoginScreen(message){
    try{
      if(S.unsubList){ S.unsubList(); S.unsubList=null; }
      if(S.unsubDoc){ S.unsubDoc(); S.unsubDoc=null; }
    }catch(e){}
    S.screen = "login";
    tabNav.style.display = "none";
    backRow.style.display = "none";
    actionbar.style.display = "none";

    main.innerHTML =
      '<div style="max-width:520px;margin:32px auto;padding:0 14px;">'
      + '<div class="card" style="padding:24px;">'
      + '<div style="font-size:24px;font-weight:800;margin-bottom:6px;">浜徳商事 福祉用具計画書</div>'
      + '<div style="color:#64748b;margin-bottom:22px;">スタッフ用ログイン</div>'
      + (message ? '<div style="background:#fff4f4;color:#b42318;border:1px solid #f0b8b8;border-radius:10px;padding:10px 12px;margin-bottom:14px;white-space:pre-line;">'+esc(message)+'</div>' : '')
      + '<label class="f-label">メールアドレス</label>'
      + '<input id="fbLoginEmail" type="email" autocomplete="username" style="width:100%;box-sizing:border-box;padding:13px;border:1px solid #cbd5e1;border-radius:10px;margin:6px 0 14px;">'
      + '<label class="f-label">パスワード</label>'
      + '<input id="fbLoginPassword" type="password" autocomplete="current-password" style="width:100%;box-sizing:border-box;padding:13px;border:1px solid #cbd5e1;border-radius:10px;margin:6px 0 18px;">'
      + '<button id="fbLoginBtn" class="btn primary" style="width:100%;padding:13px;">ログイン</button>'
      + '<div id="fbLoginStatus" style="font-size:13px;color:#64748b;text-align:center;margin-top:12px;">会社から発行されたアカウントでログインしてください。</div>'
      + '<div style="margin-top:18px;padding:11px 12px;border-radius:10px;background:#f8fafc;border:1px solid #e2e8f0;color:#475569;font-size:12px;line-height:1.65;">※このアプリは浜徳商事のスタッフ用です。ログインアカウントは管理者が発行します。入力した利用者情報はクラウドで共有されます。</div>'
      + '</div></div>';

    var btn=document.getElementById("fbLoginBtn");
    var email=document.getElementById("fbLoginEmail");
    var pw=document.getElementById("fbLoginPassword");
    var st=document.getElementById("fbLoginStatus");

    function login(){
      var e=(email.value||"").trim(), p=pw.value||"";
      if(!e || !p){
        st.textContent="メールアドレスとパスワードを入力してください。";
        st.style.color="#b42318";
        return;
      }
      btn.disabled=true;
      btn.textContent="ログイン中…";
      st.textContent="Firebaseに接続しています…";
      st.style.color="#64748b";

      window.__hamatokuAuth.signInWithEmailAndPassword(e,p).catch(function(err){
        btn.disabled=false;
        btn.textContent="ログイン";
        var msg="ログインできませんでした。";
        var code = err && err.code ? err.code : "";
        if(code==="auth/invalid-credential" || code==="auth/wrong-password" || code==="auth/user-not-found"){
          msg="ログイン情報が一致しません。メールアドレスとパスワードを確認してください。";
        } else if(code==="auth/too-many-requests"){
          msg="ログイン試行が多いため、一時的に制限されています。少し待ってから再試行してください。";
        } else if(code==="auth/operation-not-allowed"){
          msg="Firebase側でメール/パスワード認証が有効になっていません。Authenticationの「ログイン方法」を確認してください。";
        } else if(code==="auth/network-request-failed"){
          msg="ネットワーク接続に失敗しました。インターネット接続を確認してください。";
        } else if(code){
          msg="ログインエラー: " + code;
        }
        st.innerHTML = msg + (code ? '<br><span style="font-size:12px;color:#64748b;">エラーコード: '+esc(code)+'</span>' : '');
        st.style.color="#b42318";
      });
    }

    btn.addEventListener("click",login);
    [email,pw].forEach(function(el){
      el.addEventListener("keydown",function(e){
        if(e.key==="Enter") login();
      });
    });
  }

  function addLogoutButton(user){
    var bar=document.getElementById("hamatokuStatusBar");
    if(!bar) return;

    var old=document.getElementById("fbLogoutBtn");
    if(old) old.parentNode.remove();

    var wrap=document.createElement("span");
    wrap.style.display="inline-flex";
    wrap.style.alignItems="center";
    wrap.style.gap="8px";

    var who=document.createElement("span");
    who.style.fontSize="12px";
    who.style.opacity=".9";
    who.textContent=(user && user.email) ? user.email : "";

    var btn=document.createElement("button");
    btn.id="fbLogoutBtn";
    btn.textContent="ログアウト";
    btn.style.cssText="border:1px solid rgba(255,255,255,.45);background:transparent;color:#fff;border-radius:8px;padding:5px 9px;font-size:12px;cursor:pointer;";
    btn.onclick=function(){
      if(S.pending) flush();
      window.__hamatokuAuth.signOut().catch(function(){ alert("ログアウトに失敗しました。通信状態を確認してください。"); });
    };

    wrap.appendChild(who);
    wrap.appendChild(btn);
    bar.appendChild(wrap);
  }

  function setFirebaseStatus(text,color){
    var el=document.getElementById("hamatokuConn");
    if(!el) return;
    el.textContent=text;
    el.style.color=color||"#b8ffcf";
  }

  function boot(){
    try{ history.replaceState({screen:"list"}, "", location.pathname + location.search); }catch(e){}

    if(!window.__hamatokuFirebase || !window.__hamatokuAuth || !window.__hamatokuDb){
      setFirebaseStatus("● Firebase接続エラー","#ffd27a");
      var detail = "";
      try{
        if(!window.firebase){ detail = "Firebase本体のプログラム（SDK）がネットワーク上から読み込めませんでした。会社のネットワークでcdnjs.cloudflare.comへの通信がブロックされている可能性があります。"; }
        else if(window.__hamatokuFirebaseError){ detail = "詳細: " + (window.__hamatokuFirebaseError.message || window.__hamatokuFirebaseError); }
      }catch(e){}
      renderLoginScreen("Firebaseの読み込みに失敗しました。インターネット接続を確認してください。" + (detail ? ("\n" + detail) : ""));
      return;
    }

    setFirebaseStatus("● Firebase接続確認中…","#ffd27a");

    window.__hamatokuAuth.onAuthStateChanged(function(user){
      if(user){
        S.user = {
          id:function(){ return Promise.resolve(user.uid); },
          email:function(){ return Promise.resolve(user.email || ""); }
        };
        S.myId = user.uid;
        S.db = window.__hamatokuDb;

        setFirebaseStatus("● クラウド共有中（" + (user.email || "スタッフ") + "）","#b8ffcf");
        addLogoutButton(user);
        renderListScreen();
      }else{
        S.user = null;
        S.myId = null;
        S.db = null;
        setFirebaseStatus("● ログインが必要","#ffd27a");
        renderLoginScreen("");
      }
    });
  }

  boot();

})();
</script>
