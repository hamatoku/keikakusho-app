<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<meta name="theme-color" content="#2f6f5e">
<link rel="manifest" href="./manifest.json">
<title>浜徳商事 福祉用具計画書</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Yu Gothic","Noto Sans JP",sans-serif;--a:#2f6f5e;--bg:#f5f6f3;--line:#d7ddd8;--ink:#243129;--muted:#65736b;--danger:#a43d2d}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink)}
header{background:var(--a);color:#fff;padding:14px 16px;position:sticky;top:0;z-index:5}
.head{max-width:1000px;margin:auto;display:flex;justify-content:space-between;gap:12px;align-items:center}
h1{font-size:18px;margin:0}.status{font-size:12px}
main{max-width:1000px;margin:auto;padding:16px}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:14px;box-shadow:0 1px 2px #0000000a}
button,input,select,textarea{font:inherit}button{cursor:pointer}
.btn{border:1px solid var(--line);border-radius:9px;padding:9px 13px;background:#fff}.primary{background:var(--a);color:#fff;border-color:var(--a)}
.danger{color:#fff;background:var(--danger);border-color:var(--danger)}
.row{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-bottom:12px}
.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:5px;font-weight:700}
.field input,.field select,.field textarea{width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;background:#fcfdfb}
.field textarea{min-height:82px;resize:vertical}
.wide{grid-column:1/-1}.tabs{display:flex;gap:6px;margin-bottom:14px;overflow:auto}.tabs button{white-space:nowrap}.tabs .active{background:var(--a);color:#fff}
.hidden{display:none!important}.muted{color:var(--muted);font-size:13px}
.client{display:block;width:100%;text-align:left;padding:13px;margin:8px 0;border:1px solid var(--line);border-radius:10px;background:#fff}
.client strong{font-size:16px}.client small{display:block;color:var(--muted);margin-top:3px}
.actions{position:sticky;bottom:0;background:#ffffffee;border-top:1px solid var(--line);padding:10px;display:flex;gap:8px;justify-content:center;z-index:4}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.item{border:1px solid var(--line);border-radius:10px;padding:12px;margin:10px 0;background:#fafcf9}
.item h3{margin:0 0 10px;font-size:14px}
.sig{border:1px dashed #aaa;border-radius:8px;background:#fff;width:100%;height:180px;touch-action:none}
.notice{padding:10px;border-radius:8px;background:#edf5f0;color:#315848;font-size:13px;margin-bottom:12px}
@media(max-width:650px){main{padding:10px}.row,.grid3{grid-template-columns:1fr}.wide{grid-column:auto}.actions{flex-wrap:wrap}.actions .btn{flex:1}}
@media print{
 header,.tabs,.actions,.no-print{display:none!important}body{background:#fff}main{max-width:none;padding:0}.card{box-shadow:none;border:1px solid #aaa;break-inside:avoid}
 input,select,textarea{border:0!important;padding:2px!important;background:#fff!important}
}
</style>
</head>
<body>
<header><div class="head"><h1>浜徳商事　福祉用具サービス計画書</h1><div id="status" class="status">接続確認中…</div></div></header>
<main>
<div id="app"></div>
</main>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
<script>
(function(){
"use strict";

const firebaseConfig={
 apiKey:"AIzaSyCy8XvAN0T3ySX7uwG5BFRqVxxSfNSApK8",
 authDomain:"fukushiyougu-keikaku2026.firebaseapp.com",
 projectId:"fukushiyougu-keikaku2026",
 storageBucket:"fukushiyougu-keikaku2026.firebasestorage.app",
 messagingSenderId:"108714999637",
 appId:"1:108714999637:web:6f19b6665df681d0cf79dc"
};
firebase.initializeApp(firebaseConfig);
const auth=firebase.auth(), db=firebase.firestore();
const app=document.getElementById("app"), statusEl=document.getElementById("status");

let uid=null, currentId=null, currentData={}, unsubList=null, unsubDoc=null, saveTimer=null;
let equipCount=3, monitorCount=4;
let activeTab="basic";

function esc(v){return String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));}
function hiraToKata(s){return String(s||"").replace(/[\u3041-\u3096]/g,ch=>String.fromCharCode(ch.charCodeAt(0)+0x60));}
function kanaOnly(s){return /^[ぁ-ゖァ-ヺー・]+$/.test(String(s||""));}

function login(){
 app.innerHTML=`<div class="card" style="max-width:520px;margin:35px auto">
 <h2>スタッフ用ログイン</h2>
 <div class="field"><label>メールアドレス</label><input id="email" type="email" autocomplete="username"></div>
 <div class="field" style="margin-top:12px"><label>パスワード</label><input id="pw" type="password" autocomplete="current-password"></div>
 <button id="loginBtn" class="btn primary" style="width:100%;margin-top:16px">ログイン</button>
 <p id="loginMsg" class="muted">浜徳商事から発行されたアカウントでログインしてください。</p>
 </div>`;
 document.getElementById("loginBtn").onclick=()=>{
  const e=document.getElementById("email").value.trim(),p=document.getElementById("pw").value;
  const msg=document.getElementById("loginMsg"); if(!e||!p){msg.textContent="メールアドレスとパスワードを入力してください。";return}
  msg.textContent="ログイン中…";
  auth.signInWithEmailAndPassword(e,p).catch(err=>msg.textContent="ログインできませんでした: "+(err.code||""));
 };
}

function listScreen(){
 currentId=null; activeTab="basic";
 app.innerHTML=`<div class="card">
 <div style="display:flex;justify-content:space-between;gap:8px;align-items:center">
 <h2 style="margin:0">利用者一覧</h2><button id="newBtn" class="btn primary">＋ 新しい利用者</button>
 </div>
 <div class="field" style="margin-top:12px"><label>検索</label><input id="search" placeholder="氏名・フリガナ"></div>
 <div id="listMsg" class="muted" style="margin-top:8px">読み込み中…</div><div id="clients"></div>
 </div>`;
 document.getElementById("newBtn").onclick=createClient;
 document.getElementById("search").oninput=e=>renderClients(e.target.value);
 subscribeList();
}

function subscribeList(){
 if(unsubList)unsubList();
 unsubList=db.collection("clients").orderBy("updatedAt","desc").limit(300).onSnapshot(snap=>{
  window.__clients=snap.docs.map(d=>({id:d.id,data:d.data()||{}}));
  renderClients(document.getElementById("search")?.value||"");
 },err=>document.getElementById("listMsg").textContent="一覧取得エラー: "+err.code);
}
function displayName(d){return d.b_name||d.p_name||d.m_name||"氏名未入力";}
function displayKana(d){return d.b_kana||d.p_kana||d.m_kana||"";}
function renderClients(q){
 const wrap=document.getElementById("clients"),msg=document.getElementById("listMsg"); if(!wrap)return;
 const rows=(window.__clients||[]).filter(x=>(displayName(x.data)+" "+displayKana(x.data)).includes(q||""));
 msg.textContent=rows.length?"":"利用者がまだいません。";
 wrap.innerHTML=rows.map(x=>`<button class="client" data-id="${esc(x.id)}"><strong>${esc(displayName(x.data))}</strong><small>${esc(displayKana(x.data))}　${x.data.b_careLevel?esc(x.data.b_careLevel):""}</small></button>`).join("");
 wrap.querySelectorAll("[data-id]").forEach(b=>b.onclick=()=>openClient(b.dataset.id));
}
function createClient(){
 const now=new Date().toISOString();
 db.collection("clients").add({createdAt:now,updatedAt:now,updatedBy:uid,equipCount:3,usageCount:4})
 .then(r=>openClient(r.id)).catch(()=>alert("新規作成に失敗しました。"));
}

function field(name,label,type="text",wide=false,extra=""){
 return `<div class="field ${wide?"wide":""}"><label>${label}</label><input name="${name}" type="${type}" ${extra}></div>`;
}
function area(name,label,wide=true){return `<div class="field ${wide?"wide":""}"><label>${label}</label><textarea name="${name}"></textarea></div>`;}

function editScreen(){
 app.innerHTML=`<div class="no-print" style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
 <button id="back" class="btn">← 利用者一覧</button><div id="saveState" class="muted"></div>
 </div>
 <div class="tabs no-print">
  <button data-tab="basic" class="btn active">基本情報</button>
  <button data-tab="plan" class="btn">利用計画</button>
  <button data-tab="monitor" class="btn">モニタリング</button>
 </div>
 <section id="basic" class="tab"></section><section id="plan" class="tab hidden"></section><section id="monitor" class="tab hidden"></section>
 <div class="actions no-print"><button id="save" class="btn primary">保存する</button><button id="print" class="btn primary">この内容で印刷</button></div>`;
 document.getElementById("back").onclick=listScreen;
 document.querySelectorAll("[data-tab]").forEach(b=>b.onclick=()=>switchTab(b.dataset.tab));
 renderBasic();renderPlan();renderMonitor();wireEvents();
}
function switchTab(t){
 activeTab=t;document.querySelectorAll("[data-tab]").forEach(b=>b.classList.toggle("active",b.dataset.tab===t));
 document.querySelectorAll(".tab").forEach(s=>s.classList.toggle("hidden",s.id!==t));
}
function renderBasic(){
 document.getElementById("basic").innerHTML=`<div class="card">
 <h2>基本情報</h2><div class="notice">漢字で氏名を入力すると、IMEの読みをフリガナへ自動反映します。必要ならフリガナは直接修正できます。</div>
 <div class="row">${field("b_no","管理番号")}${field("b_date","作成日","date")}</div>
 <div class="row">${field("b_staff","福祉用具専門相談員名")}${field("b_kana","フリガナ")}</div>
 <div class="row">${field("b_name","利用者名")}${field("b_sex","性別")}</div>
 <div class="row">${field("b_birth","生年月日","date")}${field("b_age","年齢")}</div>
 <div class="row">${field("b_careLevel","要介護度")}${field("b_certFrom","認定期間（開始）","date")}</div>
 <div class="row">${field("b_certTo","認定期間（終了）","date")}${field("b_tel","TEL")}</div>
 <div class="row">${field("b_address","住所", "text", true)}</div>
 <div class="row">${field("b_agency","居宅介護支援事業所")}${field("b_cm","担当ケアマネジャー")}</div>
 </div>`;
}
function renderPlan(){
 let h=`<div class="card"><h2>利用計画</h2><div id="equipRows">`;
 for(let i=1;i<=equipCount;i++)h+=equipRow(i);
 h+=`</div><button id="addEquip" class="btn no-print">＋ 福祉用具を追加</button></div>`;
 document.getElementById("plan").innerHTML=h;
}
function equipRow(i){return `<div class="item"><h3>福祉用具 ${i}</h3><div class="grid3">
 <div class="field"><label>品目</label><input name="pe_kind${i}"></div>
 <div class="field"><label>数量</label><input name="pe_units${i}"></div>
 <div class="field"><label>商品名・型式</label><input name="pe_model${i}"></div>
 <div class="field"><label>TAIS等コード</label><input name="pe_code${i}"></div>
 <div class="field"><label>使用目的</label><input name="pe_reason${i}"></div>
 </div></div>`}
function renderMonitor(){
 let h=`<div class="card"><h2>モニタリング</h2><div class="row">
 ${field("m_date","実施日","date")}${field("m_prevDate","前回実施日","date")}
 ${field("m_nextMonitor","次回モニタリング予定日","date")}${field("m_staff","担当者")}
 </div><div id="monitorRows">`;
 for(let i=1;i<=monitorCount;i++)h+=monitorRow(i);
 h+=`</div><button id="addMonitor" class="btn no-print">＋ モニタリング項目を追加</button>
 <h3>署名</h3><canvas id="sig" class="sig"></canvas><div style="margin-top:8px"><button id="clearSig" class="btn no-print">署名を消す</button></div>
 </div>`;
 document.getElementById("monitor").innerHTML=h;
}
function monitorRow(i){return `<div class="item"><h3>確認項目 ${i}</h3>
 ${area("mu_problem"+i,"利用状況・本人の変化")}
 ${area("mu_check"+i,"用具の状態・適合状況")}
 ${area("mu_policy"+i,"今後の対応")}
 </div>`}

const allNames=["b_no","b_date","b_staff","b_kana","b_name","b_sex","b_birth","b_age","b_careLevel","b_certFrom","b_certTo","b_tel","b_address","b_agency","b_cm","m_date","m_prevDate","m_nextMonitor","m_staff"];
function collect(){
 const o={equipCount,usageCount};document.querySelectorAll("#app input[name],#app textarea[name],#app select[name]").forEach(e=>o[e.name]=e.value);
 o.m_signatureData=window.__sigData||"";return o;
}
function apply(data){
 currentData=data||{};equipCount=data.equipCount||3;monitorCount=data.usageCount||4;
 document.querySelectorAll("#app input[name],#app textarea[name],#app select[name]").forEach(e=>e.value=data[e.name]??"");
 loadSignature(data.m_signatureData||"");
}
function queueSave(){clearTimeout(saveTimer);saveTimer=setTimeout(doSave,600);}
function doSave(){
 if(!currentId)return;const state=document.getElementById("saveState");if(state)state.textContent="保存中…";
 const record=collect();record.updatedAt=new Date().toISOString();record.updatedBy=uid;
 db.collection("clients").doc(currentId).set(record,{merge:true}).then(()=>{if(state)state.textContent="同期済み（"+new Date().toLocaleTimeString("ja-JP",{hour:"2-digit",minute:"2-digit"})+"）";}).catch(()=>{if(state)state.textContent="保存エラー。通信を確認してください。";});
}
function wireEvents(){
 document.querySelectorAll("#app input[name],#app textarea[name],#app select[name]").forEach(e=>{
  e.addEventListener("input",()=>{autoAge(e);queueSave()});
  e.addEventListener("change",()=>{autoAge(e);queueSave()});
 });
 document.getElementById("save").onclick=doSave;
 document.getElementById("print").onclick=()=>{doSave();setTimeout(()=>window.print(),250)};
 document.getElementById("addEquip").onclick=()=>{equipCount++;const d=collect();renderPlan();wireEvents();apply(d);queueSave()};
 document.getElementById("addMonitor").onclick=()=>{monitorCount++;const d=collect();renderMonitor();wireEvents();apply(d);queueSave()};
 initSignature();
 initAutoKana();
}
function autoAge(e){
 if(e.name==="b_birth"){const d=new Date(e.value),n=new Date();if(!isNaN(d)){let a=n.getFullYear()-d.getFullYear();if(n.getMonth()<d.getMonth()||(n.getMonth()===d.getMonth()&&n.getDate()<d.getDate()))a--;const x=document.querySelector('[name="b_age"]');if(x)x.value=a;}}
}
function openClient(id){
 currentId=id;editScreen();
 if(unsubDoc)unsubDoc();
 let initialLoad=true;
 unsubDoc=db.collection("clients").doc(id).onSnapshot(snap=>{
  if(!snap.exists)return;
  const data=snap.data()||{};
  currentData=data;
  // 初回だけフォームを読み込む。自動保存後のsnapshotで入力中の画面を上書きしない。
  if(initialLoad && document.getElementById("basic")){
   initialLoad=false;
   equipCount=data.equipCount||3;monitorCount=data.usageCount||4;
   renderBasic();renderPlan();renderMonitor();wireEvents();apply(data);switchTab(activeTab);
  }
 },err=>{const s=document.getElementById("saveState");if(s)s.textContent="同期エラー: "+(err.code||"通信を確認してください")});
}

/* 安全なカナ自動入力:
   「浦島」→ウラシマの直後に「太郎」→タロウと入力した場合、
   直前まで自動生成だったカナなら後ろへ追加する。
   手動でカナを修正した場合は勝手に上書きしない。 */
function initAutoKana(){
 const fields=["b_name","p_name","m_name"];
 const buffers={};
 function applyKana(name,reading){
  if(!reading||!kanaOnly(reading))return;
  const k=document.querySelector('[name="'+name.replace("_name","_kana")+'"]');if(!k)return;
  const kata=hiraToKata(reading),cur=k.value||"",auto=k.dataset.autoKana||"";
  if(cur===auto) k.value=cur+kata;
  else if(!cur) k.value=kata;
  else return;
  k.dataset.autoKana=k.value;k.dispatchEvent(new Event("input",{bubbles:true}));
 }
 document.querySelectorAll('input[name$="_kana"]').forEach(k=>{
  k.addEventListener("input",()=>{if(k.value!==k.dataset.autoKana)k.dataset.autoKana="";});
 });
 document.addEventListener("compositionstart",e=>{
  if(e.target?.name&&fields.includes(e.target.name))buffers[e.target.name]="";
 });
 document.addEventListener("compositionupdate",e=>{
  if(e.target?.name&&fields.includes(e.target.name)&&kanaOnly(e.data))buffers[e.target.name]=e.data;
 });
 document.addEventListener("beforeinput",e=>{
  if(e.target?.name&&fields.includes(e.target.name)&&e.inputType==="insertCompositionText"&&kanaOnly(e.data))buffers[e.target.name]=e.data;
 });
 document.addEventListener("compositionend",e=>{
  if(!e.target?.name||!fields.includes(e.target.name))return;
  let r=buffers[e.target.name]||"";delete buffers[e.target.name];
  if(kanaOnly(e.data))r=e.data;
  applyKana(e.target.name,r);
 });
}

let sigCanvas,sigCtx,sigDrawing=false,last={x:0,y:0};
function initSignature(){
 sigCanvas=document.getElementById("sig");if(!sigCanvas)return;
 const resize=()=>{
  const r=sigCanvas.getBoundingClientRect(),d=Math.min(window.devicePixelRatio||1,2);
  sigCanvas.width=Math.max(1,Math.round(r.width*d));sigCanvas.height=Math.max(1,Math.round(r.height*d));
  sigCtx=sigCanvas.getContext("2d");sigCtx.setTransform(d,0,0,d,0,0);
  sigCtx.fillStyle="#fff";sigCtx.fillRect(0,0,r.width,r.height);
  sigCtx.lineWidth=2.4;sigCtx.lineCap="round";sigCtx.lineJoin="round";
  if(window.__sigData)drawSignature(window.__sigData);
 };
 resize();
 const pos=e=>{const r=sigCanvas.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}};
 sigCanvas.onpointerdown=e=>{sigDrawing=true;last=pos(e);sigCanvas.setPointerCapture(e.pointerId)};
 sigCanvas.onpointermove=e=>{if(!sigDrawing)return;const p=pos(e);sigCtx.beginPath();sigCtx.moveTo(last.x,last.y);sigCtx.lineTo(p.x,p.y);sigCtx.stroke();last=p};
 const finish=()=>{if(!sigDrawing)return;sigDrawing=false;try{window.__sigData=sigCanvas.toDataURL("image/png");queueSave()}catch(e){const st=document.getElementById("saveState");if(st)st.textContent="署名の保存に失敗しました"}};
 sigCanvas.onpointerup=finish;sigCanvas.onpointercancel=finish;
 const clear=document.getElementById("clearSig");if(clear)clear.onclick=()=>{window.__sigData="";resize();queueSave()};
}
function drawSignature(data){
 const canvas=document.getElementById("sig");if(!canvas||!data)return;
 const img=new Image();img.onload=()=>{if(!document.getElementById("sig"))return;const c=document.getElementById("sig"),ctx=c.getContext("2d"),r=c.getBoundingClientRect(),d=Math.min(window.devicePixelRatio||1,2);ctx.setTransform(d,0,0,d,0,0);ctx.fillStyle="#fff";ctx.fillRect(0,0,r.width,r.height);ctx.drawImage(img,0,0,r.width,r.height)};img.src=data;
}
function loadSignature(data){window.__sigData=data||"";if(data)drawSignature(data);else{const c=document.getElementById("sig");if(c){const ctx=c.getContext("2d"),r=c.getBoundingClientRect(),d=Math.min(window.devicePixelRatio||1,2);ctx.setTransform(d,0,0,d,0,0);ctx.fillStyle="#fff";ctx.fillRect(0,0,r.width,r.height)}}}

auth.onAuthStateChanged(user=>{
 if(user){uid=user.uid;statusEl.textContent="● クラウド共有中";listScreen();}
 else{uid=null;statusEl.textContent="● ログインが必要";login();}
});
})();
</script>
<script>
if("serviceWorker"in navigator)window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").catch(()=>{}));
</script>
</body></html>
